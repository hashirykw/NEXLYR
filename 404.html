<style>
@property --ex{syntax:'<percentage>';inherits:true;initial-value:50%}
@property --spin{syntax:'<angle>';inherits:false;initial-value:0deg}

:root{
  /* base */
  --void:#06070B; --ink:#090B11; --deep:#0D1018; --slate:#131824;
  --text:#F3F6FA; --muted:#98A3B6; --dim:#69748A;

  /* accents — iridescent trio from the glass refs */
  --brand:#18C8F0; --brand2:#5FE1FF; --brand3:#3B7DFF; --brand-deep:#0A93C4;
  --gold:#FFC978; --cy:#5FE1FF; --vi:#7FA8FF; --em:#4FE3B0; --rose:#7FD4FF;
  --bad:#FF6B72; --ok:#4FE3B0;

  /* glass tiers */
  --g1:rgba(255,255,255,.045);
  --g2:rgba(255,255,255,.075);
  --g3:rgba(255,255,255,.125);
  --g4:rgba(255,255,255,.94);
  --fx1:blur(46px) saturate(1.85);
  --fx2:blur(26px) saturate(1.7);
  --fx3:blur(15px) saturate(1.45);
  /* the frosted pane itself: a gradient, not a flat wash */
  --pane:linear-gradient(158deg, rgba(255,255,255,.11) 0%, rgba(255,255,255,.045) 34%,
          rgba(255,255,255,.022) 68%, rgba(255,255,255,.05) 100%);
  --rim:inset 0 1px 0 rgba(255,255,255,.38), inset 0 0 0 1px rgba(255,255,255,.05),
        inset 0 -24px 44px -34px rgba(0,0,0,.9);

  /* edges & light */
  --edge:rgba(255,255,255,.13);
  --edge2:rgba(255,255,255,.24);
  --hi:rgba(255,255,255,.38);
  --sheen:linear-gradient(104deg,#7FEBFF 0%,#18C8F0 46%,#3B7DFF 100%);

  /* shadow ramp */
  --s1:0 1px 3px rgba(0,0,0,.32);
  --s2:0 10px 30px -12px rgba(0,0,0,.55);
  --s3:0 26px 60px -26px rgba(0,0,0,.72);
  --s4:0 40px 90px -40px rgba(0,0,0,.85);
  --glow:0 0 0 1px rgba(255,255,255,.06), 0 18px 50px -24px rgba(24,200,240,.45);

  /* type */
  --dsp:'Space Grotesk',system-ui,sans-serif;
  --bdy:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;

  /* geometry + motion */
  --r:22px; --r-s:14px; --r-l:30px; --r-xl:38px;
  --max:1240px; --nav:74px;
  --ez:cubic-bezier(.22,.8,.32,1);
  --out:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.34,1.42,.64,1);
  --sw:cubic-bezier(.42,.04,.24,1);   /* the sweep curve — even travel, soft landing */
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--nav) + 28px);color-scheme:dark}
/* Chromium + Safari */
::-webkit-scrollbar{width:11px;height:11px;background:#080B11}
::-webkit-scrollbar-track{background:#080B11;box-shadow:inset 1px 0 0 rgba(255,255,255,.06)}
::-webkit-scrollbar-thumb{
  border-radius:99px;border:3px solid #080B11;background-clip:padding-box;
  background-color:#18C8F0;
  background-image:linear-gradient(180deg,#7FEBFF,#18C8F0 46%,#3B7DFF)}
::-webkit-scrollbar-thumb:hover{background-image:linear-gradient(180deg,#A6F2FF,#3AD8FF 46%,#5A96FF)}
::-webkit-scrollbar-thumb:active{background-image:linear-gradient(180deg,#18C8F0,#3B7DFF)}
::-webkit-scrollbar-corner,::-webkit-scrollbar-button{background:#080B11;display:none}
/* Firefox only — setting these in Chromium would disable everything above */
@supports not selector(::-webkit-scrollbar){
  html{scrollbar-width:thin;scrollbar-color:#18C8F0 #080B11}
}
body{
  font-family:var(--bdy);font-size:15.5px;line-height:1.62;letter-spacing:-.008em;
  color:var(--text);background:var(--void);overflow-x:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
img,video{display:block;max-width:100%}
svg{display:block;width:18px;height:18px;flex:none}

button,input,select,textarea{font:inherit;color:inherit}
::selection{background:rgba(24,200,240,.28)}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:6px}

/* ── ambient backdrop ─────────────────────────────────────── */
.amb{position:fixed;inset:0;z-index:-3;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(1100px 720px at 12% -8%, rgba(59,125,255,.15), transparent 62%),
    radial-gradient(900px 640px at 92% 6%, rgba(24,200,240,.15), transparent 60%),
    radial-gradient(1000px 800px at 50% 108%, rgba(24,200,240,.08), transparent 62%),
    var(--void);
}
.amb::after{content:'';position:absolute;inset:0;opacity:.45;
  background-image:
    linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:74px 74px;
  mask-image:radial-gradient(80% 60% at 50% 30%,#000,transparent 78%);
}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;z-index:-2;pointer-events:none;
  will-change:transform;animation:drift 26s var(--ez) infinite alternate}
.orb.a{width:440px;height:440px;top:-120px;left:-90px;background:radial-gradient(circle,rgba(59,125,255,.5),transparent 68%)}
.orb.b{width:520px;height:520px;top:22%;right:-160px;background:radial-gradient(circle,rgba(24,200,240,.48),transparent 68%);animation-duration:32s;animation-delay:-8s}
.orb.c{width:400px;height:400px;bottom:4%;left:14%;background:radial-gradient(circle,rgba(10,147,196,.4),transparent 68%);animation-duration:38s;animation-delay:-16s}
@keyframes drift{to{transform:translate3d(70px,-56px,0) scale(1.14)}}

/* ── layout ───────────────────────────────────────────────── */
.wrap{width:min(100% - 40px,var(--max));margin-inline:auto}

/* ── glass surfaces ───────────────────────────────────────── */
.glass{
  position:relative;border-radius:var(--r);border:1px solid var(--edge);
  background:var(--pane), var(--g1);
  backdrop-filter:var(--fx2);-webkit-backdrop-filter:var(--fx2);
  box-shadow:var(--s2), var(--rim);
}
/* specular: a soft corner bloom plus a diagonal streak, the way real frosted glass reads */
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:
    radial-gradient(120% 68% at 6% -12%, rgba(255,255,255,.13), transparent 58%),
    linear-gradient(104deg, transparent 42%, rgba(255,255,255,.055) 50%, transparent 58%);
  opacity:.95;transition:opacity .5s var(--ez)}
.glass:hover::before{opacity:1}
.slab{
  position:relative;border-radius:var(--r-xl);border:1px solid var(--edge);
  background:var(--pane), rgba(255,255,255,.028);
  backdrop-filter:var(--fx1);-webkit-backdrop-filter:var(--fx1);
  box-shadow:var(--s4), var(--rim);
}
.slab::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(140% 60% at 10% -8%, rgba(255,255,255,.09), transparent 56%)}

/* interactive card lift */
.card{padding:clamp(17px,1.9vw,23px);transition:transform .55s var(--out),border-color .45s,box-shadow .55s var(--out)}
.card:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.30);

/* cursor-tracked card sheen */
.trk{position:relative;overflow:hidden}
.urlline{display:block;margin-top:5px;overflow-wrap:anywhere;line-height:1.45}
.trk::after{content:'';position:absolute;width:340px;height:340px;border-radius:50%;
  left:var(--mx,50%);top:var(--my,50%);translate:-50% -50%;pointer-events:none;
  background:radial-gradient(circle,rgba(95,216,255,.14),transparent 66%);
  opacity:0;transition:opacity .5s var(--ez)}
.trk:hover::after{opacity:1}

/* ── THE BUTTON — iridescent sweep, entry point → exit point ── */
.btn{
  --ex:50%;
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.6rem;
  padding:.92rem 1.7rem;border-radius:999px;cursor:pointer;isolation:isolate;overflow:hidden;
  font-family:var(--dsp);font-weight:600;font-size:.9rem;letter-spacing:-.012em;white-space:nowrap;
  border:1px solid var(--edge2);background:var(--g2);
  backdrop-filter:var(--fx2);-webkit-backdrop-filter:var(--fx2);
  box-shadow:var(--s2), inset 0 1px 0 var(--hi);
  transition:--ex 1.15s var(--sw), transform .5s var(--out), box-shadow .55s var(--out),
             border-color .45s var(--ez), color .35s, background .45s;
}
/* travelling iridescent bloom — position driven by --ex */
.btn::before{
  content:'';position:absolute;z-index:0;top:50%;left:var(--ex);
  width:44%;height:260%;pointer-events:none;translate:-50% -50%;border-radius:50%;
  background:
    radial-gradient(closest-side,rgba(255,196,110,.95),transparent 74%) 2% 50%/52% 100% no-repeat,
    radial-gradient(closest-side,rgba(120,226,255,.95),transparent 74%) 50% 50%/52% 100% no-repeat,
    radial-gradient(closest-side,rgba(172,142,255,.95),transparent 74%) 98% 50%/52% 100% no-repeat;
  filter:blur(13px);opacity:0;mix-blend-mode:plus-lighter;
  transition:opacity .22s var(--ez), scale .5s var(--out);
  scale:.72 .82;
}
/* glazed shine bar that runs across the surface */
.btn::after{
  content:'';position:absolute;inset:0;z-index:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(76deg,transparent 38%,rgba(255,255,255,.30) 50%,transparent 62%);
  background-size:300% 100%;background-position:140% 0;
  transition:background-position 1.15s var(--out), opacity .4s;opacity:0;
}
.btn:hover,.btn:focus-visible{
  transform:translateY(-2px);border-color:rgba(255,255,255,.32);
  background:rgba(255,255,255,.085);
  box-shadow:var(--s3), inset 0 1px 0 rgba(255,255,255,.5), 0 0 46px -18px rgba(140,200,255,.55);
}
.btn:hover::before,.btn:focus-visible::before{opacity:.62;scale:1 1}
/* JS drops this class for one frame so the light snaps to the entry point */
.btn.nosw{transition:none!important}
.btn:hover::after,.btn:focus-visible::after{background-position:-140% 0;opacity:1}
.btn:active{transform:translateY(0) scale(.985)}
.btn svg{width:17px;height:17px;flex:none;transition:transform .5s var(--out)}
.btn:hover svg.arw{transform:translateX(4px)}

/* primary — the white luxury pill from the navbar ref */
.btn.p{
  background:var(--g4);color:#0A0C12;border-color:rgba(255,255,255,.9);
  box-shadow:0 8px 26px -10px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.5) inset,
             0 22px 48px -26px rgba(140,190,255,.7);
}
.btn.p::after{z-index:1;background:linear-gradient(76deg,transparent 38%,rgba(255,255,255,.9) 50%,transparent 62%);
  background-size:300% 100%;mix-blend-mode:overlay}
.btn.p::before{z-index:1;width:56%;height:200%;filter:blur(16px);opacity:0;mix-blend-mode:multiply;
  background:
    radial-gradient(closest-side,rgba(255,206,140,.92),rgba(255,255,255,0) 76%) 2% 50%/54% 100% no-repeat,
    radial-gradient(closest-side,rgba(150,222,255,.92),rgba(255,255,255,0) 76%) 50% 50%/54% 100% no-repeat,
    radial-gradient(closest-side,rgba(196,176,255,.92),rgba(255,255,255,0) 76%) 98% 50%/54% 100% no-repeat}
.btn.p:hover::before{opacity:.62}
.btn.p:hover{color:#06070B;background:#fff;box-shadow:0 14px 40px -12px rgba(0,0,0,.75),
  0 0 0 1px rgba(255,255,255,.72) inset, 0 30px 74px -28px rgba(150,200,255,.8)}

/* ghost */
.btn.g{background:transparent;border-color:var(--edge);box-shadow:none}
.btn.g:hover{background:var(--g2);box-shadow:var(--s2), inset 0 1px 0 var(--hi)}
/* whatsapp tint */
.btn.wa::before{background:
    radial-gradient(closest-side,rgba(79,235,178,.95),transparent 74%) 2% 50%/58% 100% no-repeat,
    radial-gradient(closest-side,rgba(120,226,255,.9),transparent 74%) 98% 50%/58% 100% no-repeat}
.btn.sm{padding:.62rem 1.1rem;font-size:.82rem}
.btn.lg{padding:1rem 1.9rem;font-size:.95rem}
.btn.blk{display:flex;width:100%}

/* icon-only round */
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;
  border:1px solid var(--edge);background:var(--g2);backdrop-filter:var(--fx3);-webkit-backdrop-filter:var(--fx3);
  box-shadow:var(--s2), inset 0 1px 0 var(--hi);cursor:pointer;
  transition:transform .45s var(--spring),border-color .4s,box-shadow .45s}
.iconbtn:hover{transform:translateY(-2px) scale(1.06);border-color:var(--edge2);
  box-shadow:var(--s3), inset 0 1px 0 rgba(255,255,255,.45), 0 0 30px -12px rgba(95,216,255,.7)}
.iconbtn svg{width:18px;height:18px}

/* ── nav ──────────────────────────────────────────────────── */
.nav{position:fixed;top:14px;left:0;right:0;z-index:900;transition:transform .55s var(--out),top .4s}
.nav.hid{transform:translateY(-136%)}
.navin{
  width:min(100% - 30px,1280px);margin-inline:auto;height:var(--nav);
  display:flex;align-items:center;gap:22px;padding:0 12px 0 24px;border-radius:999px;
  border:1px solid var(--edge);background:rgba(10,12,18,.62);
  backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);
  box-shadow:var(--s3), inset 0 1px 0 rgba(255,255,255,.14);
  transition:background .45s,border-color .45s,box-shadow .45s;
}
.nav.stuck .navin{background:rgba(8,10,15,.82);border-color:var(--edge2);box-shadow:var(--s4), inset 0 1px 0 rgba(255,255,255,.2)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--dsp);font-weight:700;
  font-size:1.12rem;letter-spacing:-.045em;flex:none}
.mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:radial-gradient(120% 120% at 30% 15%, #0E1A24, #060A0F);
  border:1px solid rgba(24,200,240,.42);
  box-shadow:0 6px 20px -8px rgba(24,200,240,.85), inset 0 1px 0 rgba(255,255,255,.18)}
.mark svg{width:22px;height:22px;color:var(--brand)}
.navlinks{display:flex;align-items:center;gap:4px;margin-left:auto}
.navlinks a{position:relative;padding:.5rem .76rem;border-radius:999px;font-size:.855rem;
  color:var(--muted);font-weight:500;transition:color .35s,background .35s}
.navlinks a:hover,.navlinks a.on{color:var(--text);background:var(--g2)}
.navlinks a.on::after{content:'';position:absolute;left:50%;bottom:2px;translate:-50% 0;
  width:16px;height:2px;border-radius:2px;background:var(--sheen)}
.navcta{display:flex;align-items:center;gap:8px;flex:none}
.burger{display:none}
@media(max-width:1080px){

@media(max-width:420px){.navin{padding:0 10px 0 16px;gap:10px}.brand{font-size:1.06rem}}

/* drawer */
.drawer{position:fixed;inset:0;z-index:950;display:grid;place-items:center;
  background:rgba(4,5,9,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  opacity:0;visibility:hidden;transition:opacity .45s var(--ez),visibility .45s}
.drawer.open{opacity:1;visibility:visible}
.drawerin{width:min(100% - 34px,440px);padding:30px;border-radius:var(--r-l);
  border:1px solid var(--edge2);background:rgba(14,17,25,.86);
  backdrop-filter:var(--fx1);-webkit-backdrop-filter:var(--fx1);box-shadow:var(--s4);
  transform:translateY(22px) scale(.97);transition:transform .55s var(--spring);max-height:88vh;overflow-y:auto}
.drawer.open .drawerin{transform:none}
.drawerin a.dl{display:flex;align-items:center;justify-content:space-between;
  padding:.92rem 1.05rem;border-radius:var(--r-s);font-family:var(--dsp);font-weight:600;font-size:1.06rem;
  border:1px solid transparent;transition:background .35s,border-color .35s,transform .35s var(--out)}
.drawerin a.dl:hover{background:var(--g2);border-color:var(--edge);transform:translateX(4px)}
.drawerin a.dl svg{width:16px;height:16px;color:var(--dim)}

/* ── pills / segmented control (ref 1) ────────────────────── */
.seg{display:inline-flex;padding:5px;gap:3px;border-radius:999px;border:1px solid var(--edge);
  background:var(--g1);backdrop-filter:var(--fx3);-webkit-backdrop-filter:var(--fx3);
  box-shadow:inset 0 1px 0 var(--hi),var(--s1);flex-wrap:wrap;justify-content:center}
.seg button{padding:.52rem .95rem;border-radius:999px;border:1px solid transparent;background:none;
  font-family:var(--dsp);font-weight:600;font-size:.82rem;color:var(--muted);cursor:pointer;
  transition:color .4s,background .45s var(--ez),border-color .4s,box-shadow .45s}
.seg button:hover{color:var(--text)}
.seg button.on{color:var(--text);background:var(--g3);border-color:var(--edge2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42), 0 4px 16px -6px rgba(0,0,0,.6)}

.chip{display:inline-flex;align-items:center;gap:.42rem;padding:.4rem .78rem;border-radius:999px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--edge);background:var(--g1)}
.chip.ok{color:var(--em);border-color:rgba(79,227,176,.3);background:rgba(79,227,176,.09)}

/* ── grids ────────────────────────────────────────────────── */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:960px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}

.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
.featin{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:start}
.featin ul.ticks{columns:2;column-gap:26px}
.featin ul.ticks li{break-inside:avoid}
@media(max-width:820px){.featin{grid-template-columns:1fr;gap:20px}.featin ul.ticks{columns:1}}
.bento>*{grid-column:span 2}
.bento>.feat{grid-column:span 6}
.bento>.wide{grid-column:span 3}
@media(max-width:980px){.bento{grid-template-columns:repeat(4,1fr)}
  .bento>.feat{grid-column:span 4}.bento>.wide{grid-column:span 2}}
@media(max-width:620px){.bento{grid-template-columns:1fr;gap:14px}
  .bento>*,.bento>.feat,.bento>.wide{grid-column:span 1}}

/* icon tile */
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;
  border:1px solid var(--edge2);background:var(--g3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), var(--s1);margin-bottom:18px;
  transition:transform .55s var(--spring),box-shadow .5s}
.ico svg{width:21px;height:21px;stroke-width:1.6}
.card:hover .ico{transform:translateY(-3px) rotate(-4deg);box-shadow:inset 0 1px 0 rgba(255,255,255,.55), 0 0 28px -10px rgba(95,216,255,.85)}
.ico.cy{color:var(--cy)} .ico.vi{color:var(--vi)} .ico.go{color:var(--gold)}
.ico.em{color:var(--em)} .ico.ro{color:var(--rose)}

/* list */
.tick{display:flex;gap:.65rem;align-items:flex-start;color:var(--muted);font-size:.875rem;line-height:1.58;padding:.26rem 0}
.tick svg{width:16px;height:16px;flex:none;margin-top:.28rem;color:var(--em)}
ul.ticks{list-style:none}

/* stat */
.stat .n{font-family:var(--dsp);font-size:clamp(1.6rem,2.9vw,2.25rem);font-weight:700;letter-spacing:-.05em;line-height:1}
.stat .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-top:9px}

/* ── marquee ──────────────────────────────────────────────── */
.mq{overflow:hidden;position:relative;padding:16px 0;
  mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.mqt{display:flex;gap:52px;width:max-content;animation:mqx 34s linear infinite}
.mq:hover .mqt{animation-play-state:paused}
.mqt span{font-family:var(--dsp);font-weight:600;font-size:.94rem;color:var(--dim);white-space:nowrap;
  display:flex;align-items:center;gap:52px;letter-spacing:-.02em}
.mqt span::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--vi);opacity:.6}
@keyframes mqx{to{transform:translateX(-50%)}}

/* ── accordion ────────────────────────────────────────────── */
.acc{border:1px solid var(--edge);border-radius:var(--r-s);background:var(--g1);
  backdrop-filter:var(--fx3);-webkit-backdrop-filter:var(--fx3);overflow:hidden;
  transition:border-color .4s,background .4s}
.acc+.acc{margin-top:12px}
.acc[open]{border-color:var(--edge2);background:var(--g2)}
.acc summary{list-style:none;cursor:pointer;padding:18px 20px;display:flex;align-items:center;gap:14px;
  font-family:var(--dsp);font-weight:600;font-size:.94rem;letter-spacing:-.018em}
.acc summary::-webkit-details-marker{display:none}
.acc summary i{position:relative;margin-left:auto;width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:1px solid var(--edge);background:var(--g2);transition:transform .5s var(--spring),background .4s}
.acc summary i::before{content:'';width:9px;height:1.6px;background:var(--text);position:absolute}
.acc summary i::after{content:'';width:1.6px;height:9px;background:var(--text);position:absolute;transition:opacity .35s}
.acc[open] summary i{transform:rotate(180deg);background:var(--g3)}
.acc[open] summary i::after{opacity:0}
.acc .accb{padding:0 20px 20px 20px;color:var(--muted);font-size:.9rem;line-height:1.7}

/* ── form ─────────────────────────────────────────────────── */
.field{margin-bottom:18px;position:relative}
.field label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.field label .req{color:var(--rose);margin-left:3px}
.inp{
  width:100%;padding:.85rem 1rem;border-radius:var(--r-s);
  border:1px solid var(--edge);background:rgba(255,255,255,.045);
  backdrop-filter:var(--fx3);-webkit-backdrop-filter:var(--fx3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09);
  font-size:.9rem;transition:border-color .35s,box-shadow .4s,background .35s;
}
.inp::placeholder{color:var(--dim)}
.inp:focus{outline:none;border-color:rgba(95,216,255,.55);background:rgba(255,255,255,.07);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 0 0 4px rgba(95,216,255,.13)}
textarea.inp{resize:vertical;min-height:126px;line-height:1.6}
select.inp{appearance:none;cursor:pointer;color-scheme:dark;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2398A3B6' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 1rem center}
select.inp option{background:#0F141C;color:var(--text)}

/* ── custom dropdown (JS upgrades every select.inp into this) ── */
.sel{position:relative}
.sel>select.inp{position:absolute;opacity:0;pointer-events:none;width:100%;height:100%;left:0;top:0}
.selbtn{
  width:100%;display:flex;align-items:center;gap:.6rem;cursor:pointer;text-align:left;
  padding:.85rem 1rem;border-radius:var(--r-s);font-size:.9rem;
  border:1px solid var(--edge);background:var(--pane), rgba(255,255,255,.03);
  backdrop-filter:var(--fx3);-webkit-backdrop-filter:var(--fx3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
  transition:border-color .35s,box-shadow .4s,background .35s}
.selbtn:hover{border-color:var(--edge2)}
.selbtn .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbtn .cv{width:14px;height:14px;flex:none;color:var(--muted);
  transition:transform .42s var(--spring),color .3s}
.sel.open .selbtn{border-color:rgba(24,200,240,.6);background:var(--pane), rgba(255,255,255,.06);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 0 0 4px rgba(24,200,240,.13)}
.sel.open .selbtn .cv{transform:rotate(180deg);color:var(--brand2)}
.field.bad .selbtn{border-color:rgba(255,107,114,.65);box-shadow:0 0 0 4px rgba(255,107,114,.12)}
.field.good .selbtn{border-color:rgba(79,227,176,.5)}

.selmenu{
  position:absolute;z-index:40;left:0;right:0;top:calc(100% + 8px);
  max-height:260px;overflow-y:auto;padding:6px;border-radius:var(--r-s);
  border:1px solid var(--edge2);
  background:linear-gradient(180deg,rgba(18,23,33,.985),rgba(11,15,22,.985));
  backdrop-filter:var(--fx1);-webkit-backdrop-filter:var(--fx1);
  box-shadow:var(--s4), inset 0 1px 0 rgba(255,255,255,.16);
  opacity:0;visibility:hidden;transform:translateY(-6px) scale(.985);transform-origin:top center;
  transition:opacity .28s var(--ez),transform .34s var(--out),visibility .3s}
.sel.open .selmenu{opacity:1;visibility:visible;transform:none}
.sel.up .selmenu{top:auto;bottom:calc(100% + 8px);transform-origin:bottom center}
.selmenu::-webkit-scrollbar{width:6px}
.selmenu::-webkit-scrollbar-thumb{background:rgba(24,200,240,.4);border-radius:9px;border:0}
.selmenu button{
  width:100%;display:flex;align-items:center;gap:.55rem;cursor:pointer;text-align:left;
  padding:.62rem .75rem;border-radius:10px;border:1px solid transparent;background:none;
  font-size:.88rem;color:var(--muted);
  transition:background .26s,color .26s,border-color .26s}
.selmenu button:hover,.selmenu button.cur{background:var(--g3);color:var(--text);border-color:var(--edge)}
.selmenu button .tk{width:14px;height:14px;flex:none;opacity:0;color:var(--brand2)}
.selmenu button[aria-selected="true"]{color:var(--text);background:rgba(24,200,240,.12);
  border-color:rgba(24,200,240,.3)}
.selmenu button[aria-selected="true"] .tk{opacity:1}
.field.bad .inp{border-color:rgba(255,107,114,.65);box-shadow:0 0 0 4px rgba(255,107,114,.12)}
.field.good .inp{border-color:rgba(79,227,176,.5)}
.err{display:none;align-items:center;gap:.4rem;color:var(--bad);font-size:.8rem;margin-top:7px;font-weight:500}
.field.bad .err{display:flex}
.err svg{width:13px;height:13px;flex:none}
.hp{position:absolute;left:-9999px;opacity:0;pointer-events:none}
.formnote{font-size:.8rem;color:var(--dim);line-height:1.6;margin-top:14px}
.fmsg{display:none;margin-top:16px;padding:15px 17px;border-radius:var(--r-s);font-size:.9rem;
  border:1px solid rgba(79,227,176,.35);background:rgba(79,227,176,.1);color:var(--em)}
.fmsg.on{display:block;animation:pop .5s var(--spring)}
.fmsg.e{border-color:rgba(255,107,114,.35);background:rgba(255,107,114,.1);color:var(--bad)}
@keyframes pop{from{opacity:0;transform:translateY(9px) scale(.98)}}
.cnt{font-family:var(--mono);font-size:10px;color:var(--dim);position:absolute;right:2px;top:0}

/* ── contact rows ─────────────────────────────────────────── */
.crow{display:flex;align-items:center;gap:14px;padding:15px 17px;border-radius:var(--r-s);
  border:1px solid var(--edge);background:var(--g1);transition:transform .45s var(--out),border-color .4s,background .4s}
.crow+.crow{margin-top:11px}
.crow:hover{transform:translateX(5px);border-color:var(--edge2);background:var(--g2)}
.crow .ci{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;
  border:1px solid var(--edge2);background:var(--g3);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.crow .ci svg{width:18px;height:18px}
.crow>span:last-child{min-width:0;flex:1}
.crow .k{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);line-height:1.5}
.crow .v{display:block;font-family:var(--dsp);font-weight:600;font-size:.9rem;letter-spacing:-.015em;margin-top:2px;overflow-wrap:anywhere}

/* ── footer ───────────────────────────────────────────────── */
.foot{border-top:1px solid var(--edge);margin-top:20px;position:relative;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.022))}
.footgrid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.3fr;gap:44px;padding:66px 0 44px}
@media(max-width:900px){.footgrid{grid-template-columns:1fr 1fr;gap:34px}}
@media(max-width:520px){.footgrid{grid-template-columns:1fr;gap:28px;padding:48px 0 34px}}
.foot h5{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim);margin-bottom:18px}
.foot ul{list-style:none;display:flex;flex-direction:column;gap:11px}
.foot ul a{color:var(--muted);font-size:.87rem;transition:color .32s,transform .32s var(--out);display:inline-block}
.foot ul a:hover{color:var(--text);transform:translateX(4px)}
.foot .fbot{border-top:1px solid var(--edge);padding:22px 0 30px;display:flex;flex-wrap:wrap;
  gap:14px;align-items:center;justify-content:space-between;font-size:.83rem;color:var(--dim)}
.soc{display:flex;gap:9px}
.soc a{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  border:1px solid var(--edge);background:var(--g1);color:var(--muted);
  transition:transform .45s var(--spring),color .35s,border-color .35s,background .35s,box-shadow .45s}
.soc a:hover{transform:translateY(-3px);color:var(--text);border-color:var(--edge2);background:var(--g2);
  box-shadow:0 0 26px -10px rgba(95,216,255,.8)}
.soc a svg{width:17px;height:17px}

/* ── chatbot ──────────────────────────────────────────────── */
.botfab{position:fixed;right:18px;bottom:18px;z-index:910;width:58px;height:58px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;border:1px solid rgba(255,255,255,.28);
  background:rgba(14,18,26,.72);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
  box-shadow:var(--s3), inset 0 1px 0 rgba(255,255,255,.4), 0 0 34px -12px rgba(95,216,255,.9);
  transition:transform .5s var(--spring),box-shadow .5s}
.botfab:hover{transform:scale(1.08) translateY(-2px)}
.botfab svg{width:23px;height:23px}
.botfab .dot{position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;
  background:var(--em);border:2px solid #0B0E14;animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(max-width:760px){.botfab{bottom:16px;right:14px;width:50px;height:50px}}

.botwin{position:fixed;right:18px;bottom:88px;z-index:920;width:min(calc(100vw - 32px),382px);
  height:min(560px,72vh);display:flex;flex-direction:column;border-radius:var(--r-l);overflow:hidden;
  border:1px solid var(--edge2);background:rgba(11,14,20,.9);
  backdrop-filter:var(--fx1);-webkit-backdrop-filter:var(--fx1);box-shadow:var(--s4);
  opacity:0;visibility:hidden;transform:translateY(18px) scale(.96);transform-origin:bottom right;
  transition:opacity .45s var(--ez),transform .5s var(--spring),visibility .45s}
.botwin.open{opacity:1;visibility:visible;transform:none}
@media(max-width:760px){.botwin{bottom:76px;right:14px;height:min(500px,66vh)}}
.bothead{padding:16px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--edge);
  background:linear-gradient(180deg,rgba(255,255,255,.06),transparent)}
.bothead .av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:var(--sheen);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.bothead .av svg{width:19px;height:19px;color:#06070B}
.botbody{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.botbody::-webkit-scrollbar{width:5px}
.botbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px}
.msg{max-width:86%;padding:10px 13px;border-radius:15px;font-size:.86rem;line-height:1.58;animation:mIn .42s var(--out)}
@keyframes mIn{from{opacity:0;transform:translateY(9px)}}
.msg.b{align-self:flex-start;background:var(--g2);border:1px solid var(--edge);border-bottom-left-radius:6px}
.msg.u{align-self:flex-end;background:var(--g4);color:#0A0C12;font-weight:500;border-bottom-right-radius:6px}
.msg a{color:var(--cy);text-decoration:underline;text-underline-offset:2px}
.msg.u a{color:#0B4F72}
.quicks{display:flex;flex-wrap:wrap;gap:7px;padding:0 18px 12px}
.quicks button{padding:.46rem .78rem;border-radius:999px;font-size:.79rem;cursor:pointer;
  border:1px solid var(--edge);background:var(--g1);color:var(--muted);
  transition:background .35s,color .35s,border-color .35s,transform .35s var(--out)}
.quicks button:hover{background:var(--g3);color:var(--text);border-color:var(--edge2);transform:translateY(-2px)}
.botfoot{padding:12px 14px;border-top:1px solid var(--edge);display:flex;gap:9px;align-items:center}
.botfoot input{flex:1;padding:.7rem .95rem;border-radius:999px;font-size:.9rem;
  border:1px solid var(--edge);background:rgba(255,255,255,.05)}
.botfoot input:focus{outline:none;border-color:rgba(95,216,255,.5)}
.botfoot button{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;cursor:pointer;
  border:none;background:var(--sheen);color:#06070B;transition:transform .4s var(--spring)}
.botfoot button:hover{transform:scale(1.09)}
.botfoot button svg{width:16px;height:16px}
.typing{display:flex;gap:4px;align-items:center;padding:12px 15px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tp 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

/* ── reveal ───────────────────────────────────────────────── */
[data-rv]{opacity:0;transform:translateY(26px);
  transition:opacity .85s var(--out),transform .85s var(--out);
  transition-delay:calc(var(--i,0) * 75ms)}
[data-rv].in{opacity:1;transform:none}

/* ── progress + misc ──────────────────────────────────────── */
.prog{position:fixed;top:0;left:0;height:2px;z-index:999;background:var(--sheen);
  width:0;box-shadow:0 0 14px rgba(95,216,255,.85);transition:width .1s linear}
.hr{height:1px;background:linear-gradient(90deg,transparent,var(--edge2),transparent);margin:0}
.center{text-align:center}
.mt{margin-top:36px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row.mid{justify-content:center}
.mono{font-family:var(--mono)}
.small{font-size:.83rem}
.muted{color:var(--muted)}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
  [data-rv]{opacity:1;transform:none}
  .orb{animation:none}
}
/* ══════════════ DEVICE MOCKUP THUMBNAILS ══════════════ */
.thumb{
  position:relative;height:184px;margin:-2px -2px 16px;border-radius:16px;overflow:hidden;
  background:
    radial-gradient(130% 100% at 50% 2%, color-mix(in srgb, var(--ac) 26%, transparent), transparent 62%),
    linear-gradient(165deg, color-mix(in srgb, var(--ac2) 92%, transparent) 0%,
                    color-mix(in srgb, var(--ac2) 60%, #05070C) 58%, rgba(5,7,12,.92) 100%);
  border:1px solid color-mix(in srgb, var(--ac) 22%, var(--edge));
  display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:16px 12px 0;
  isolation:isolate;
}
/* floor bloom under the devices */
.thumb::before{content:'';position:absolute;left:50%;bottom:-34%;translate:-50% 0;z-index:0;
  width:86%;height:62%;border-radius:50%;
  background:radial-gradient(closest-side, color-mix(in srgb, var(--ac) 62%, transparent), transparent 74%);
  filter:blur(26px);opacity:.9}
/* diagonal light streak across the whole scene */
.thumb .glare{position:absolute;inset:-30% -10%;z-index:3;pointer-events:none;
  background:linear-gradient(102deg,transparent 38%,rgba(255,255,255,.11) 50%,transparent 60%);
  transform:translateX(-38%);transition:transform 1.1s var(--out);}
.card:hover .thumb .glare{transform:translateX(38%)}
.card:hover .thumb .dv{transform:translateY(-6px)}
.card:hover .thumb .dv.mac{transform:translateY(-10px) scale(1.03)}

.dv{position:relative;flex:none;z-index:1;transition:transform .62s var(--out);will-change:transform}
.dv .scr{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2.5px;padding:3.5px;
  background:linear-gradient(178deg, color-mix(in srgb,var(--ac2) 96%,#000), #05070C)}
/* glass reflection on the device face */
.dv .gloss{position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:inherit;
  background:linear-gradient(146deg,rgba(255,255,255,.16) 0 18%,transparent 42%)}

/* nav strip with a tiny real wordmark */
.dv .nv{display:flex;align-items:center;gap:3px;height:6.5px;flex:none;padding:0 2px}
.dv .nv b{font-family:var(--dsp);font-weight:700;font-size:3.6px;letter-spacing:.02em;
  color:color-mix(in srgb,var(--ac) 80%,#fff);line-height:1;white-space:nowrap}
.dv .nv .nl{display:flex;gap:2px;margin-left:auto}
.dv .nv .nl i{width:5px;height:1.3px;border-radius:1px;background:rgba(255,255,255,.28)}
.dv .nv .npill{width:9px;height:3.4px;border-radius:99px;flex:none;
  background:color-mix(in srgb,var(--ac) 78%,transparent)}

/* hero band — carries the brand mark + glyph */
.dv .hero{position:relative;overflow:hidden;flex:none;border-radius:2.5px;
  height:34%;display:flex;flex-direction:column;justify-content:center;gap:2.5px;padding:0 5px;
  background:linear-gradient(112deg, color-mix(in srgb,var(--ac) 70%,transparent),
             color-mix(in srgb,var(--ac) 12%,transparent) 78%)}
.dv .hero.ser{background:
  linear-gradient(98deg, color-mix(in srgb,var(--ac) 52%,transparent), transparent 74%),
  linear-gradient(180deg, color-mix(in srgb,var(--ac2) 90%,#000), #06090E)}
.dv .hero.ph{background:
  radial-gradient(58% 96% at 82% 42%, color-mix(in srgb,var(--ac) 92%,transparent), transparent 70%),
  linear-gradient(100deg, color-mix(in srgb,var(--ac) 34%,transparent), color-mix(in srgb,var(--ac2) 92%,#000))}
.dv .hero.dk{background:linear-gradient(96deg, color-mix(in srgb,var(--ac) 86%,transparent) 0 34%,
  color-mix(in srgb,var(--ac2) 92%,#000) 34%)}
.dv .hero.gl{background:linear-gradient(124deg, color-mix(in srgb,var(--ac) 58%,transparent), transparent 60%),
  rgba(255,255,255,.075)}
.dv .hero.biz{background:linear-gradient(106deg, color-mix(in srgb,var(--ac) 46%,transparent), transparent 72%),
  rgba(255,255,255,.05)}
.dv .hero.big{height:50%;background:linear-gradient(148deg, color-mix(in srgb,var(--ac) 82%,transparent),
  color-mix(in srgb,var(--ac2) 94%,#000) 84%)}
.dv .hero.sm{height:30%}
.dv .hero .wm{font-family:var(--dsp);font-weight:700;font-size:4.5px;letter-spacing:.05em;
  color:#fff;line-height:1.12;text-shadow:0 1px 3px rgba(0,0,0,.55);position:relative;z-index:2;
  max-width:74%;overflow:hidden;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dv.pad .hero .wm{font-size:3.7px;max-width:80%}
.dv .hero.big .wm{font-size:6.4px;letter-spacing:.1em}
.dv .hero .sub{display:block;height:1.5px;width:44%;border-radius:2px;
  background:rgba(255,255,255,.55);position:relative;z-index:2}
.dv .hero .cta{display:block;width:15px;height:4px;border-radius:99px;margin-top:1px;
  background:rgba(255,255,255,.92);position:relative;z-index:2}
/* the brand glyph, watermarked into the hero */
.dv .hero .gy{position:absolute;right:-6%;top:50%;translate:0 -50%;z-index:1;
  width:44%;aspect-ratio:1;display:grid;place-items:center;opacity:.42}
.dv .hero .gy svg{width:100%!important;height:100%!important;stroke-width:1.1;
  color:#fff;filter:drop-shadow(0 1px 4px rgba(0,0,0,.4))}
.dv.phone .hero .gy{right:auto;left:50%;translate:-50% -50%;width:56%;opacity:.5}

/* content blocks */
.dv .rowb{display:grid;gap:2.5px;flex:1;min-height:0}
.dv .rowb.c1{grid-template-columns:1fr}
.dv .rowb.c2{grid-template-columns:repeat(2,1fr)}
.dv .rowb.c3{grid-template-columns:repeat(3,1fr)}
.dv .rowb.c4{grid-template-columns:repeat(4,1fr)}
.dv .rowb.g6{grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr}
.dv .rowb i{border-radius:2px;background:rgba(255,255,255,.085);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.12)}
.dv .rowb i.a{background:color-mix(in srgb, var(--ac) 34%, rgba(255,255,255,.08))}
.dv .ln{height:2.2px;border-radius:2px;background:rgba(255,255,255,.14);flex:none}
.dv .ln.s{width:46%} .dv .ln.m{width:70%}

/* MacBook */
.dv.mac{width:190px}
.dv.mac .lid{border:1.5px solid rgba(255,255,255,.3);border-radius:8px 8px 3px 3px;
  background:#05070C;padding:4px 4px 5px;box-shadow:0 12px 26px -10px rgba(0,0,0,.9)}
.dv.mac .bar{height:9px;display:flex;align-items:center;gap:3px;padding:0 4px}
.dv.mac .bar i{width:3.5px;height:3.5px;border-radius:50%;background:rgba(255,255,255,.3)}
.dv.mac .bar .url{flex:1;height:4.5px;border-radius:3px;background:rgba(255,255,255,.1);margin-left:4px}
.dv.mac .scr{height:104px;border-radius:2.5px}
.dv.mac .base{height:5px;margin:0 -11px;border-radius:0 0 6px 6px;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.12));
  box-shadow:0 8px 16px -8px rgba(0,0,0,.9)}
.dv.mac .base::after{content:'';display:block;width:26px;height:1.5px;margin:1px auto 0;
  border-radius:0 0 3px 3px;background:rgba(0,0,0,.45)}

/* iPad */
.dv.pad{width:76px}
.dv.pad .body{border:1.5px solid rgba(255,255,255,.28);border-radius:9px;background:#05070C;padding:4px;
  box-shadow:0 10px 22px -9px rgba(0,0,0,.9)}
.dv.pad .scr{height:102px;border-radius:5px}

/* iPhone 17 Pro Max */
.dv.phone{width:52px}

@media(max-width:1024px){.thumb{height:170px;margin-bottom:14px}
  .dv.mac{width:172px}.dv.pad{width:70px}.dv.phone{width:48px}
  .dv.mac .scr{height:94px}.dv.pad .scr{height:92px}.dv.phone .scr{height:96px}}
@media(max-width:760px){.thumb{height:186px;margin-bottom:13px}
  .dv.mac{width:190px}.dv.pad{width:76px}.dv.phone{width:52px}

/* ══════════════ PROJECT MODAL ══════════════ */
.pmodal{position:fixed;inset:0;z-index:960;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(4,5,9,.78);
  backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  opacity:0;visibility:hidden;transition:opacity .42s var(--ez),visibility .42s}
.pmodal.open{opacity:1;visibility:visible}
.pmodalin{width:min(100%,1080px);max-height:92vh;overflow-y:auto;border-radius:var(--r-xl);
  border:1px solid var(--edge2);background:rgba(12,15,22,.93);
  backdrop-filter:var(--fx1);-webkit-backdrop-filter:var(--fx1);box-shadow:var(--s4);
  transform:translateY(26px) scale(.965);transition:transform .55s var(--spring);--ac:#5FD8FF}
.pmodal.open .pmodalin{transform:none}
.pmodalin::-webkit-scrollbar{width:6px}
.pmodalin::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:9px}

.phead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:15px;padding:22px 26px;
  border-bottom:1px solid var(--edge);
  background:linear-gradient(180deg,rgba(16,20,29,.98),rgba(14,18,26,.92))}
.phead .pico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;
  border:1px solid var(--edge2);background:var(--g3);color:var(--ac);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.phead .pt{flex:1;min-width:0}
.phead h3{letter-spacing:-.028em}
.phead .ph{font-family:var(--mono);font-size:10.5px;color:var(--dim);display:block;margin-top:4px;
  overflow-wrap:anywhere;letter-spacing:.04em}

.pstage{padding:26px;display:flex;flex-direction:column;align-items:center;gap:18px;
  background:
    radial-gradient(90% 70% at 50% 0%, color-mix(in srgb, var(--ac) 13%, transparent), transparent 70%);
  border-bottom:1px solid var(--edge)}
.pframe{position:relative;width:100%;max-width:100%;cursor:pointer;transition:transform .55s var(--out);
  display:flex;align-items:center;justify-content:center;min-height:400px}
.pframe:hover{transform:translateY(-4px)}
.pframe .tapnote{position:absolute;inset:auto 0 -4px 0;text-align:center;font-family:var(--mono);
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);
  opacity:0;transition:opacity .4s;pointer-events:none}
.pframe:hover .tapnote{opacity:1}

/* live viewport shells */
.shell{position:relative;background:#05070C;overflow:hidden;flex:none;max-width:100%;
  box-shadow:0 30px 70px -28px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.06)}
.shell iframe{border:0;display:block;transform-origin:top left;background:#0A0D14;position:relative;z-index:2}
.shell .skel{position:absolute;inset:0;z-index:1;display:grid;place-content:center;justify-items:center;
  gap:10px;padding:26px;text-align:center;background:
    linear-gradient(180deg,#0C1119,#080B11)}
.shell .skel span{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.14);
  border-top-color:var(--brand);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.shell .skel b{font-family:var(--dsp);font-size:.9rem;color:var(--muted);font-weight:600}
.shell .skel em{font-style:normal;font-size:.76rem;color:var(--dim);max-width:30ch;line-height:1.5}
.shell .veil{position:absolute;inset:0;z-index:3;background:transparent}  /* swallows iframe clicks */

.shell.desktop{width:840px;border-radius:11px;border:1px solid rgba(255,255,255,.2)}
.shell.desktop .chrome{height:30px;display:flex;align-items:center;gap:6px;padding:0 12px;
  background:linear-gradient(180deg,#1C222D,#141922);border-bottom:1px solid rgba(255,255,255,.09)}
.shell.desktop .chrome i{width:9px;height:9px;border-radius:50%;flex:none}
.shell.desktop .chrome i:nth-child(1){background:#FF5F57}
.shell.desktop .chrome i:nth-child(2){background:#FEBC2E}
.shell.desktop .chrome i:nth-child(3){background:#28C840}
.shell.desktop .chrome .url{flex:1;height:17px;border-radius:6px;margin-left:8px;
  background:rgba(0,0,0,.32);display:flex;align-items:center;padding:0 9px;
  font-family:var(--mono);font-size:9.5px;color:var(--dim);overflow:hidden;white-space:nowrap}
.shell.desktop .vp{height:525px;overflow:hidden}

.shell.tablet{width:396px;border-radius:22px;border:8px solid #14181F;
  outline:1px solid rgba(255,255,255,.22)}
.shell.tablet .vp{height:528px;overflow:hidden;border-radius:14px}

.shell.phone{width:264px;border-radius:34px;border:9px solid #14181F;
  outline:1px solid rgba(255,255,255,.26)}
.shell.phone .vp{height:574px;overflow:hidden;border-radius:26px}
.shell.phone .isl{position:absolute;top:15px;left:50%;translate:-50% 0;width:78px;height:23px;
  border-radius:99px;background:#000;z-index:4;border:1px solid rgba(255,255,255,.1)}

.pbody{padding:26px}
.pbody .kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ac);margin-bottom:12px}
.pgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:30px;align-items:start}
@media(max-width:820px){.pgrid{grid-template-columns:1fr;gap:22px}}

@media(max-width:980px){
  .shell.desktop{width:min(100%,620px)}
  .shell.desktop .vp{height:400px}
  .pframe{min-height:340px}
}
@media(max-width:560px){
  .pmodal{padding:10px}
  .phead{padding:16px 18px}.pstage{padding:18px 12px}.pbody{padding:20px 18px}
  .shell.desktop{width:100%}
  .shell.desktop .vp{height:270px}
  .shell.desktop .chrome .url{font-size:8.5px}
  .shell.tablet{width:280px}.shell.tablet .vp{height:380px}
  .shell.phone{width:210px}.shell.phone .vp{height:455px}
  .pframe{min-height:300px}
}

.frameoff{display:grid;place-items:center;height:100%;padding:30px;text-align:center;gap:14px}
.frameoff p{color:var(--muted);font-size:.88rem;max-width:34ch;line-height:1.65}

/* ══════════════ TEAM CARDS ══════════════ */
.teamgrid{display:grid;grid-template-columns:1.42fr 1fr 1fr;gap:18px;align-items:start}
@media(max-width:1000px){.teamgrid{grid-template-columns:1fr 1fr}
  .teamgrid>.founder{grid-column:span 2}}
@media(max-width:640px){.teamgrid{grid-template-columns:1fr}
  .teamgrid>.founder{grid-column:span 1}}

.pcard{cursor:pointer;padding:0;overflow:hidden;display:flex;flex-direction:column;text-align:left;
  border:1px solid var(--edge);background:var(--pane), var(--g1);border-radius:var(--r);width:100%;
  backdrop-filter:var(--fx2);-webkit-backdrop-filter:var(--fx2);
  box-shadow:var(--s2), var(--rim);
  transition:transform .55s var(--out),border-color .45s,box-shadow .55s var(--out)}
.pcard:hover{transform:translateY(-6px);border-color:var(--edge2);
  box-shadow:var(--s3), inset 0 1px 0 rgba(255,255,255,.42), 0 0 46px -20px rgba(34,207,245,.5)}
.pshot{position:relative;aspect-ratio:4/5;overflow:hidden;flex:none;background:#0C1018}
.founder .pshot{aspect-ratio:1/1}
@media(max-width:640px){.founder .pshot{aspect-ratio:4/5}}
.pshot img{width:100%;height:100%;object-fit:cover;object-position:center 22%;
  transition:transform 1s var(--out),filter .6s;filter:saturate(.94) contrast(1.03)}
.pcard:hover .pshot img{transform:scale(1.055);filter:saturate(1.06) contrast(1.05)}
.pshot::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(6,7,11,0) 42%,rgba(6,7,11,.72) 78%,rgba(6,7,11,.95))}
.pshot .badge{position:absolute;top:13px;left:13px;z-index:2}
.pshot .cap{position:absolute;left:20px;right:20px;bottom:16px;z-index:2}
.pshot .cap h3{letter-spacing:-.03em;text-shadow:0 2px 18px rgba(0,0,0,.7)}
.founder .pshot .cap h3{font-size:clamp(1.4rem,2.4vw,1.9rem)}
.pshot .cap .role{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--brand2);display:block;margin-top:6px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.pmeta{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.pmeta p{color:var(--muted);font-size:.85rem;line-height:1.64;flex:1}
.founder .pmeta p{font-size:.9rem}
.pmore{display:flex;align-items:center;gap:7px;margin-top:16px;color:var(--brand2);
  font-family:var(--dsp);font-weight:600;font-size:.87rem}
.pcard:hover .pmore svg{transform:translateX(4px)}
.pmore svg{transition:transform .5s var(--out)}

/* team modal */
.tgrid{display:grid;grid-template-columns:.85fr 1.15fr;gap:0}
@media(max-width:760px){.tgrid{grid-template-columns:1fr}}
.tgrid .tshot{position:relative;min-height:100%;background:#0C1018;overflow:hidden}
.tgrid .tshot img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
@media(max-width:760px){.tgrid .tshot{aspect-ratio:4/3}
  .tgrid .tshot img{object-position:center 18%}}
.tgrid .tinfo{padding:30px;border-left:1px solid var(--edge)}
@media(max-width:760px){.tgrid .tinfo{border-left:none;border-top:1px solid var(--edge);padding:24px 20px}}

/* ══════════════ REVIEW RACK ══════════════ */
.rack{display:flex;gap:10px;height:392px;align-items:stretch}
.rk{position:relative;flex:0 0 68px;min-width:68px;overflow:hidden;cursor:pointer;
  border:1px solid var(--edge);border-radius:var(--r);background:var(--pane), var(--g1);
  backdrop-filter:var(--fx2);-webkit-backdrop-filter:var(--fx2);
  box-shadow:var(--s2), var(--rim);
  transition:flex .78s var(--out),min-width .78s var(--out),
             background .5s var(--ez),border-color .5s,box-shadow .5s}
.rk.on{flex:1 1 auto;min-width:280px;background:var(--g2);border-color:var(--edge2);
  box-shadow:var(--s3), inset 0 1px 0 rgba(255,255,255,.4), 0 0 50px -24px rgba(34,207,245,.55)}
.rk:not(.on):hover{background:var(--g2);border-color:var(--edge2)}

.rk .spine{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  transition:opacity .42s var(--ez);pointer-events:none}
.rk.on .spine{opacity:0}
.rk .spine b{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--dsp);
  font-weight:600;font-size:.95rem;letter-spacing:-.01em;white-space:nowrap;color:var(--muted)}
.rk .spine i{position:absolute;top:20px;left:50%;translate:-50% 0;width:7px;height:7px;
  border-radius:50%;background:var(--brand);box-shadow:0 0 12px var(--brand);opacity:.85}
.rk .spine u{position:absolute;bottom:20px;left:50%;translate:-50% 0;text-decoration:none;
  font-family:var(--mono);font-size:10px;color:var(--dim)}

.rk .rkbody{position:absolute;inset:0;padding:26px;display:flex;flex-direction:column;
  opacity:0;transition:opacity .5s var(--ez) .12s;pointer-events:none;
  min-width:280px}
.rk.on .rkbody{opacity:1;pointer-events:auto}
.rk .rkbody .stars{display:flex;gap:3px;color:var(--gold);margin-bottom:16px}
.rk .rkbody h3{margin-bottom:14px;max-width:26ch}
.rk .rkbody blockquote{color:var(--muted);font-size:.92rem;line-height:1.7;max-width:52ch;flex:1}
.rk .rkbody figcaption{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  color:var(--dim);margin-top:20px;text-transform:uppercase}
.rk .qm{position:absolute;right:24px;top:14px;font-family:var(--dsp);font-size:6rem;line-height:1;
  color:rgba(255,255,255,.05);pointer-events:none;user-select:none}

@media(max-width:900px){
  .rack{flex-direction:column;height:auto}
  .rk{flex:0 0 62px;min-width:0;min-height:62px}
  .rk.on{flex:0 0 auto;min-width:0;min-height:260px}
  .rk .spine{justify-content:flex-start;padding-left:24px}
  .rk .spine b{writing-mode:horizontal-tb;transform:none}
  .rk .spine i{top:50%;left:auto;right:22px;translate:0 -50%}
  .rk .spine u{display:none}
  .rk .rkbody{position:relative;inset:auto;min-width:0;padding:24px 20px}
  .rk:not(.on) .rkbody{display:none}
  .rk .qm{font-size:4rem;right:16px}
}

/* ══════════════ HERO EARTH ══════════════ */
.herowrap{display:grid;grid-template-columns:1.14fr .86fr;gap:38px;align-items:center}
@media(max-width:1000px){.herowrap{grid-template-columns:1fr;gap:24px}}

.earth{position:relative;cursor:grab;aspect-ratio:1/1;width:100%;max-width:540px;margin-inline:auto;
  display:grid;isolation:isolate}
.earth>*{grid-area:1/1;width:100%;height:100%;min-width:0;min-height:0}
.earth::before{content:'';position:absolute;inset:6%;border-radius:50%;z-index:-1;
  background:radial-gradient(circle at 44% 36%, rgba(24,200,240,.42), rgba(59,125,255,.20) 44%, transparent 70%);
  filter:blur(34px)}
/* The canvas used to be clipped with border-radius:50%, which sliced off
   every point that reached toward the viewer and left a flat disc. It now
   renders square and overscans its box, so the near hemisphere can spill
   past where the sphere's silhouette used to end. */
.earth canvas{width:100%;height:100%;display:block;overflow:visible;
  transform:scale(1.09);transform-origin:50% 50%}
.earth video{width:100%;height:100%;display:block;border-radius:50%}
.earth{overflow:visible}
.earth video{object-fit:cover;opacity:0;transition:opacity .8s var(--ez)}
.earth video.on{opacity:1}
.earth canvas.off{display:none}
/* logo-matched orbit rings drawn over the globe */
.earth .rings{position:absolute;inset:0;width:100%!important;height:100%!important;
  pointer-events:none;z-index:-1;overflow:visible}
.earth .rings circle{fill:none;stroke:var(--brand);vector-effect:non-scaling-stroke}
.earth .rings .r1{stroke-width:1;opacity:.55}
.earth .rings .r2{stroke-width:1;opacity:.4;stroke-dasharray:3 5;
  transform-origin:50% 50%;animation:orb 46s linear infinite}
.earth .rings .r3{stroke-width:1;opacity:.28}
.earth .rings line{stroke:var(--brand);stroke-width:1;opacity:.42;vector-effect:non-scaling-stroke}
@keyframes orb{to{transform:rotate(360deg)}}
@media(max-width:1000px){.earth{max-width:400px}}
@media(max-width:560px){.earth{max-width:300px}}
@media(prefers-reduced-motion:reduce){.earth .rings .r2{animation:none}}

/* ══════════════ PROJECT DECK — perspective, ghost numerals, pop-out ══════════════ */
#workgrid{perspective:1600px;perspective-origin:50% 40%}

/* the big translucent index numeral, top-right of every card */
.pnum{
  position:absolute;top:6px;right:14px;z-index:4;pointer-events:none;
  font-family:var(--dsp);font-weight:700;font-size:3.1rem;line-height:1;letter-spacing:-.05em;
  color:transparent;-webkit-text-stroke:1px color-mix(in srgb, var(--ac) 46%, transparent);
  opacity:.55;transition:opacity .5s var(--ez),transform .6s var(--out)}
.card:hover .pnum{opacity:.95;transform:translateY(-2px) scale(1.04)}
@media(max-width:760px){.pnum{font-size:2.4rem;right:11px}}

/* resting tilt — the deck leans, like the reference */
#workgrid>.card{
  transform-style:preserve-3d;
  transform:rotateY(var(--ty,0deg)) rotateX(var(--tx,0deg)) translateZ(0);
  transition:transform .6s var(--out),border-color .45s,box-shadow .55s var(--out)}
#workgrid>.card:nth-child(3n+1){--ty:4.5deg}
#workgrid>.card:nth-child(3n+2){--ty:0deg}
#workgrid>.card:nth-child(3n+3){--ty:-4.5deg}
#workgrid>.card:hover{--ty:0deg;--tx:0deg;transform:translateY(-7px) scale(1.012)}
@media(max-width:900px){#workgrid>.card{--ty:0deg!important}}

/* ── pressed: the card leaves the page ── */
.popveil{position:fixed;inset:0;z-index:930;background:rgba(4,5,9,.74);
  backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);
  opacity:0;visibility:hidden;transition:opacity .5s var(--ez),visibility .5s}
.popveil.on{opacity:1;visibility:visible}
.popph{pointer-events:none}
.card.popping{
  z-index:940;cursor:default;
  transition:transform .72s var(--spring),box-shadow .72s var(--out),border-color .5s;
  box-shadow:0 60px 120px -40px rgba(0,0,0,.95), var(--rim),
             0 0 90px -30px color-mix(in srgb, var(--ac) 60%, transparent);
  border-color:color-mix(in srgb, var(--ac) 40%, rgba(255,255,255,.3));
}
.card.popping .pnum{opacity:1}
.card.popping .thumb .glare{transform:translateX(38%)}
.pophint{
  position:absolute;left:0;right:0;bottom:-34px;text-align:center;z-index:5;
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.5);opacity:0;transition:opacity .45s var(--ez) .35s}
.card.popping .pophint{opacity:1}

/* ══════════════ LINING BUTTON — a light that traces the outline ══════════════ */
.btn .ring{
  position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;z-index:4;padding:1.6px;
  background:conic-gradient(from var(--spin),
    transparent 0deg 232deg,
    color-mix(in srgb, var(--brand2) 70%, transparent) 288deg,
    #FFFFFF 330deg,
    color-mix(in srgb, var(--brand2) 70%, transparent) 348deg,
    transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite:exclude;
  opacity:0;transition:opacity .4s var(--ez)}
.btn.line:hover .ring,
.btn.line:focus-visible .ring,
.btn.line.lit .ring{opacity:1;animation:trace 1.9s linear infinite}
@keyframes trace{from{--spin:0deg}to{--spin:360deg}}
/* on the white pill the trace reads as a coloured edge instead of white-on-white */
.btn.p .ring{background:conic-gradient(from var(--spin),
    transparent 0deg 232deg, rgba(24,200,240,.55) 288deg, #18C8F0 330deg,
    rgba(59,125,255,.6) 348deg, transparent 360deg);padding:2px}
@media(prefers-reduced-motion:reduce){
  .btn.line:hover .ring,.btn.line.lit .ring{animation:none;opacity:.8}
  .card.popping{transition-duration:.01ms}
}


/* ══════════════ PROJECT DECK v2 — tighter cards, deeper fan ══════════════
   Scoped to #workgrid so nothing else on the page inherits the shrink.
   Inline styles on the card internals mean a few !important flags are
   unavoidable here. */
#workgrid{gap:15px;perspective:1500px;perspective-origin:26% 46%}

/* ── the card gets meaningfully smaller ── */
#workgrid>.card{padding:14px 15px 16px}
#workgrid>.card .thumb{height:clamp(120px,10.4vw,146px);margin:-1px -1px 12px;border-radius:13px}
#workgrid>.card h3{font-size:clamp(.9rem,1.12vw,1.01rem);line-height:1.22}
#workgrid>.card .urlline{font-size:9.5px!important;margin-top:4px}
#workgrid>.card>div:first-of-type{gap:10px!important;margin-bottom:9px!important}
#workgrid>.card .iconbtn{width:30px!important;height:30px!important}
#workgrid>.card .iconbtn svg{width:13px;height:13px}
#workgrid>.card p.mono{font-size:9px!important;margin-bottom:8px!important;letter-spacing:.11em}
#workgrid>.card p.muted{font-size:.775rem;line-height:1.6!important}
#workgrid>.card .row{gap:5px!important;margin-top:12px!important}
#workgrid>.card .chip{font-size:8.6px;padding:.29rem .56rem;gap:.34rem}
#workgrid>.card .pnum{font-size:2.45rem;top:4px;right:11px}

/* ── the rake ──────────────────────────────────────────────────────────
   Ported from the Cambridge Online trio: one uniform angle for every card,
   each one set further back than the card to its left, rather than the
   symmetric fan I had before. --col is the card's position in its visible
   row (0/1/2) and is assigned in JS, because the category filter hides
   cards with display:none and nth-child would count the hidden ones. */
#workgrid>.card{
  transform-style:flat;backface-visibility:hidden;
  --col:0;
  transform:translateX(calc(var(--col) * -3%))
            translateZ(calc(var(--col) * -46px))
            rotateY(-13deg);
  transition:transform .78s cubic-bezier(.22,.9,.28,1),
             border-color .45s,box-shadow .55s var(--out),opacity .45s var(--ez),
             filter .45s var(--ez);
}
/* hover pulls the card forward and squares it up to the reader */
#workgrid>.card:hover,#workgrid>.card:focus-visible{
  transform:translateX(calc(var(--col) * -3%))
            translateZ(calc(var(--col) * -46px + 52px))
            rotateY(-5deg);
  will-change:transform;
}
/* The rest fall back so the one being read is the only thing competing.
   Driven by :has() rather than a JS class: popping a card moves it to
   <body> and back, so the grid never received the pointerleave and the
   dim state stuck on with nothing hovered — every card greyed at once.
   Browsers without :has() simply skip the dim, which is a fine floor. */
#workgrid:has(> .card:hover) > .card:not(:hover){opacity:.5;filter:saturate(.72)}

/* The grid's own box sits at z=0 while cards 2 and 3 are behind it, so in a
   perspective context the grid swallows every press meant for a receded
   card and only the first column ever opens. Hand the press back.
   Desktop only — the flattened phone layout needs normal hit-testing. */
@media(min-width:961px){
  #workgrid{pointer-events:none}
  #workgrid>.card{pointer-events:auto}
  /* The rake pulls the right-hand columns inward, which leaves the row
     sitting ~42px left of centre. Nudge the whole grid back over so it
     reads centred under its heading. */
  #workgrid{transform:translateX(21px)}
}

/* the pop-out is driven by inline transforms from JS — make sure the resting
   tilt never fights it, and never animate a card that is mid-flight */
#workgrid>.card.popping,.card.popping{--col:0;transform:none}

/* The hint sat at bottom:-34px, outside the card box — and the raised card
   gets overflow-y:auto from JS, which was clipping it off. Put it in flow. */
.card.popping .pophint{position:static;left:auto;right:auto;bottom:auto;
  display:block;margin:15px 0 1px}

@media(prefers-reduced-motion:reduce){
  #workgrid>.card,#workgrid>.card:hover{transform:none!important;transition:none}
}


/* ══════════════ PROCESS STEPS — centred rows, each step goes somewhere ══════════════
   Five cards in a three-up grid leaves the last two hanging on the left with a
   third of the row empty. A six-track grid with each card spanning two lets the
   orphan row start half a track in, so it sits centred under the ones above.
   Scoped to .steps5 so #workgrid keeps its own three real tracks — the rake
   reads the track count from JS and would mis-angle on six. */
/* orphan-row centring is handled by the shared .grid rules below */

/* the step card is a link now, so it needs a link's affordances */
.stepcard{display:flex;flex-direction:column;text-decoration:none;color:inherit}
.stepcard p{flex:1}
.steplink{
  display:inline-flex;align-items:center;gap:7px;margin-top:16px;
  font-family:var(--dsp);font-weight:600;font-size:.82rem;color:var(--cy);
  opacity:.72;transition:opacity .4s var(--ez),gap .4s var(--out)}
.steplink svg{width:15px;height:15px;transition:transform .5s var(--out)}
.stepcard:hover .steplink,.stepcard:focus-visible .steplink{opacity:1}
.stepcard:hover .steplink svg{transform:translateX(4px)}
@media(prefers-reduced-motion:reduce){.steplink,.steplink svg{transition:none}}


/* ══════════════ ORPHAN-ROW CENTRING ══════════════
   A 3-up grid holding 4, 5, 7, 8, 10... cards always leaves the last row
   hanging on the left with dead space beside it. Every grid below is given
   double the tracks it needs, each card spanning two, so a short final row
   can start half a track in and sit centred under the rows above.

   The selectors are count-agnostic on purpose — nothing here is tied to a
   specific number of cards, so adding or removing one, or filtering the
   project grid, still lands centred:
     :last-child:nth-child(3n+1)     -> last card starts a row, so it is alone
     :nth-last-child(2):nth-child(3n+1) -> last row holds exactly two
   ─────────────────────────────────────────────────────────────────────── */

@media(min-width:961px){
  .grid.g3{grid-template-columns:repeat(6,1fr)}
  .grid.g3>*{grid-column:span 2}
  .grid.g3>*:last-child:nth-child(3n+1){grid-column:3 / span 2}
  .grid.g3>*:nth-last-child(2):nth-child(3n+1){grid-column:2 / span 2}
  .grid.g3>*:last-child:nth-child(3n+2){grid-column:4 / span 2}

  .grid.g4{grid-template-columns:repeat(8,1fr)}
  .grid.g4>*{grid-column:span 2}
  .grid.g4>*:last-child:nth-child(4n+1){grid-column:4 / span 2}
  .grid.g4>*:nth-last-child(2):nth-child(4n+1){grid-column:3 / span 2}
  .grid.g4>*:last-child:nth-child(4n+2){grid-column:5 / span 2}
  .grid.g4>*:nth-last-child(3):nth-child(4n+1){grid-column:2 / span 2}
}

/* two-up band: g3 and g4 collapse to two columns here, g2 already is */
@media(min-width:621px) and (max-width:960px){
  .grid.g2,.grid.g3,.grid.g4{grid-template-columns:repeat(4,1fr)}
  .grid.g2>*,.grid.g3>*,.grid.g4>*{grid-column:span 2}
  .grid.g2>*:last-child:nth-child(2n+1),
  .grid.g3>*:last-child:nth-child(2n+1),
  .grid.g4>*:last-child:nth-child(2n+1){grid-column:2 / span 2}
}
@media(min-width:961px){
  .grid.g2{grid-template-columns:repeat(4,1fr)}
  .grid.g2>*{grid-column:span 2}
  .grid.g2>*:last-child:nth-child(2n+1){grid-column:2 / span 2}
}


/* ══════════════ RAISED CARD — 50% transparent panel ══════════════
   The panel sits at 50% opacity as asked. Straight 50% alpha over a busy
   hero leaves body copy unreadable, so the transparency is paired with a
   heavy backdrop blur: whatever is behind still shows through at half
   strength, but as soft colour rather than competing text and edges. */
.card.popping{
  background:linear-gradient(155deg,
      rgba(26,32,46,.5) 0%,
      rgba(13,17,26,.5) 55%,
      rgba(9,12,19,.5) 100%)!important;
  backdrop-filter:blur(26px) saturate(1.25);
  -webkit-backdrop-filter:blur(26px) saturate(1.25);
}
/* the veil behind it drops back so the card reads as the transparent layer */
.popveil{background:rgba(4,5,9,.62)}

/* raised cards get room for their full copy rather than a clamped preview */
.card.popping p{-webkit-line-clamp:unset!important;display:block!important;
  max-height:none!important;overflow:visible!important}
.card.popping .thumb{height:clamp(150px,26vw,230px)!important}
.card.popping .steplink{opacity:1}

/* ══════════════ ORBIT MOTIF ══════════════
   The hero globe's ring cage, reused as a quiet watermark so the rest of
   the page belongs to the same object. Pure CSS, no second WebGL context. */
.orbit{position:absolute;pointer-events:none;z-index:-1;aspect-ratio:1/1;
  border-radius:50%;opacity:.16;
  border:1px solid var(--brand);
  animation:orbspin 46s linear infinite}
.orbit::before,.orbit::after{content:'';position:absolute;border-radius:50%;
  border:1px solid var(--brand)}
.orbit::before{inset:11%;border-style:dashed;opacity:.8}
.orbit::after{inset:26%;opacity:.55}
.orbit.slow{animation-duration:74s;animation-direction:reverse}
@keyframes orbspin{to{transform:rotate(360deg)}}
.sec{position:relative}
/* The orbits sit deliberately outside their section box, which widened the
   document by ~228px and gave the whole page a horizontal scrollbar.
   overflow-x:clip trims the overhang WITHOUT creating a scroll container,
   so it cannot trap sticky/fixed descendants the way overflow:hidden would. */
.sec.hasorb{overflow-x:clip}
@media(max-width:760px){.orbit{display:none}}
@media(prefers-reduced-motion:reduce){.orbit{animation:none}}

/* a raised card is one readable column, whatever it was in the grid */
.card.popping .featin{grid-template-columns:1fr!important;gap:20px!important}
.card.popping .ticks{columns:2;column-gap:20px}
@media(max-width:620px){.card.popping .ticks{columns:1}}
.card.popping .pophint{border-top:1px solid rgba(255,255,255,.12);padding-top:14px}

/* ══════════════ CARD TILT ══════════════
   Cards lean toward the pointer. Applied via a class rather than to .card
   directly, so the project rake and the raised pop-out keep their own
   transforms and never fight this one. */
.card.tilt3d{
  transform:perspective(1000px)
            rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))
            translateY(var(--ty,0px)) translateZ(0);
  transform-style:preserve-3d;
  transition:transform .5s var(--out),border-color .45s,box-shadow .55s var(--out);
}
.card.tilt3d.live{transition:transform .1s linear,border-color .45s,box-shadow .55s var(--out)}
.card.tilt3d:hover{--ty:-6px}
.card.tilt3d .ico,.card.tilt3d h3,.card.tilt3d h4{transform:translateZ(26px)}
.card.tilt3d .steplink,.card.tilt3d .chip{transform:translateZ(14px)}
.card.tilt3d.popping{transform:none;transform-style:flat}

/* paint containment: a card's repaint can never dirty the rest of the page */
.card{contain:layout style paint}
.card.popping{contain:none}

@media(hover:none),(prefers-reduced-motion:reduce){
  .card.tilt3d{transform:none!important;transition:none}
  .card.tilt3d .ico,.card.tilt3d h3,.card.tilt3d h4,
  .card.tilt3d .steplink,.card.tilt3d .chip{transform:none}
}

/* ══════════════ BLUR BUDGET ══════════════
   The page was compositing 117 backdrop-filter layers. The 31 cards alone
   blurred ~4.8 million px² of backdrop every frame — and they sit on a flat
   dark gradient, so almost none of that blur is visible.

   backdrop-filter is kept only where something genuinely overlays moving
   content: the nav, the drawer, modals, the select menu, the chat window,
   the veil and the raised card. Everything else gets a slightly more opaque
   pane instead, which is visually near-identical over this background and
   costs nothing to composite. */
.card,.glass.card{
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
  background:linear-gradient(158deg,
      rgba(30,36,50,.72) 0%, rgba(17,21,32,.74) 55%, rgba(12,15,23,.76) 100%);
}
/* small chrome: a blur under a 100px pill is invisible and still costs a layer */
.eyebrow,.iconbtn,.btn.p,.btn.g,.btn.wa,.seg,.inp,.selbtn,.acc,.rk{
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
}
.eyebrow,.seg,.acc,.rk{background:rgba(255,255,255,.045)}
.iconbtn{background:rgba(255,255,255,.07)}
.inp,.selbtn{background:rgba(10,13,20,.62)}
/* the raised card keeps its blur — it is the one thing sitting over the page */
.card.popping{
  backdrop-filter:blur(26px) saturate(1.25)!important;
  -webkit-backdrop-filter:blur(26px) saturate(1.25)!important;
}
