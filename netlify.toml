# Nexlyr Solutions — static site, no build step.

[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/web-development"
  to = "/web-development.html"
  status = 301

[[redirects]]
  from = "/video-editing"
  to = "/video-editing.html"
  status = 301

[[redirects]]
  from = "/design-and-ads"
  to = "/design-and-ads.html"
  status = 301

# Headers also live in _headers; kept here so the config is self-describing.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
